[project]
name = "astra-common"
version = "0.1.0"
description = "Shared Python utilities for AstraQuant services"
requires-python = ">=3.12"
dependencies = ["fastapi", "pydantic", "pyjwt", "bcrypt"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astra_common*"]
