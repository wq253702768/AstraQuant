version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: astraquant-postgres
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_password
      POSTGRES_DB: astraquant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astraquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: astraquant-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: astraquant-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  minio:
    image: minio/minio:latest
    container_name: astraquant-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: astraquant-auth-service
    environment:
      SERVICE_NAME: auth-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  strategy-service:
    build:
      context: .
      dockerfile: services/strategy-service/Dockerfile
    container_name: astraquant-strategy-service
    environment:
      SERVICE_NAME: strategy-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
      - nats

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: astraquant-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      ENV: dev
      AUTH_SERVICE_URL: http://auth-service:8001
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - strategy-service

volumes:
  postgres_data:
  minio_data:
