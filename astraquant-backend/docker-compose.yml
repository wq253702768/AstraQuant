version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: astraquant-postgres
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: astra_password
      POSTGRES_DB: astraquant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astra -d astraquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: astraquant-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:latest
    container_name: astraquant-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]

  minio:
    image: minio/minio:latest
    container_name: astraquant-minio
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: astraquant-auth-service
    environment:
      SERVICE_NAME: auth-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      LOG_LEVEL: INFO
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis

  strategy-service:
    build:
      context: .
      dockerfile: services/strategy-service/Dockerfile
    container_name: astraquant-strategy-service
    environment:
      SERVICE_NAME: strategy-service
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    ports:
      - "8002:8002"
    depends_on:
      - postgres
      - redis
      - nats

  exchange-access-gateway:
    build:
      context: .
      dockerfile: services/exchange-access-gateway/Dockerfile
    container_name: astraquant-exchange-access-gateway
    environment:
      SERVICE_NAME: exchange-access-gateway
      ENV: dev
      HTTP_PORT: 8010
      POSTGRES_DSN: postgres://astra:astra_password@postgres:5432/astraquant?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      OKX_REST_BASE_URL: https://www.okx.com
      OKX_TIMEOUT_MS: 5000
      OKX_ENABLE_DEMO: "false"
      LOG_LEVEL: INFO
      RATE_LIMIT_ENABLED: "true"
      AUDIT_ENABLED: "true"
    ports:
      - "8010:8010"
    depends_on:
      - postgres
      - redis
      - nats

  market-data-service:
    build:
      context: .
      dockerfile: services/market-data-service/Dockerfile
    container_name: astraquant-market-data-service
    environment:
      SERVICE_NAME: market-data-service
      ENV: dev
      HTTP_PORT: 8003
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      EXCHANGE_GATEWAY_URL: http://exchange-access-gateway:8010
      LOG_LEVEL: INFO
    ports:
      - "8003:8003"
    depends_on:
      - postgres
      - redis
      - nats
      - exchange-access-gateway

  backtest-service:
    build:
      context: .
      dockerfile: services/backtest-service/Dockerfile
    container_name: astraquant-backtest-service
    environment:
      SERVICE_NAME: backtest-service
      ENV: dev
      HTTP_PORT: 8004
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      MARKET_DATA_SERVICE_URL: http://market-data-service:8003
      LOG_LEVEL: INFO
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - redis
      - nats
      - strategy-service
      - market-data-service

  replay-service:
    build:
      context: .
      dockerfile: services/replay-service/Dockerfile
    container_name: astraquant-replay-service
    environment:
      SERVICE_NAME: replay-service
      ENV: dev
      HTTP_PORT: 8005
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      BACKTEST_SERVICE_URL: http://backtest-service:8004
      MARKET_DATA_SERVICE_URL: http://market-data-service:8003
      LOG_LEVEL: INFO
    ports:
      - "8005:8005"
    depends_on:
      - postgres
      - redis
      - nats
      - backtest-service

  ai-analysis-service:
    build:
      context: .
      dockerfile: services/ai-analysis-service/Dockerfile
    container_name: astraquant-ai-analysis-service
    environment:
      SERVICE_NAME: ai-analysis-service
      ENV: dev
      HTTP_PORT: 8006
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DATABASE: astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      BACKTEST_SERVICE_URL: http://backtest-service:8004
      REPLAY_SERVICE_URL: http://replay-service:8005
      OPENAI_MODEL_NAME: gpt-5.5-thinking
      OPENAI_MODEL_VERSION: "2026-05"
      OPENAI_TEMPERATURE: "0.2"
      LOG_LEVEL: INFO
    ports:
      - "8006:8006"
    depends_on:
      - postgres
      - redis
      - nats
      - backtest-service
      - replay-service

  strategy-score-service:
    build:
      context: .
      dockerfile: services/strategy-score-service/Dockerfile
    container_name: astraquant-strategy-score-service
    environment:
      SERVICE_NAME: strategy-score-service
      ENV: dev
      HTTP_PORT: 8007
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      BACKTEST_SERVICE_URL: http://backtest-service:8004
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8006
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      LOG_LEVEL: INFO
    ports:
      - "8007:8007"
    depends_on:
      - postgres
      - redis
      - nats
      - backtest-service
      - ai-analysis-service

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: astraquant-report-service
    environment:
      SERVICE_NAME: report-service
      ENV: dev
      HTTP_PORT: 8008
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio_password
      MINIO_SECURE: "false"
      BACKTEST_SERVICE_URL: http://backtest-service:8004
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8006
      STRATEGY_SCORE_SERVICE_URL: http://strategy-score-service:8007
      REPLAY_SERVICE_URL: http://replay-service:8005
      LOG_LEVEL: INFO
    ports:
      - "8008:8008"
    depends_on:
      - postgres
      - redis
      - nats
      - minio
      - backtest-service
      - ai-analysis-service
      - strategy-score-service

  realtime-market-gateway:
    build:
      context: .
      dockerfile: services/realtime-market-gateway/Dockerfile
    container_name: astraquant-realtime-market-gateway
    environment:
      SERVICE_NAME: realtime-market-gateway
      ENV: dev
      HTTP_PORT: 8011
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      OKX_PUBLIC_WS_URL: wss://ws.okx.com:8443/ws/v5/public
      OKX_BUSINESS_WS_URL: wss://ws.okx.com:8443/ws/v5/business
      EXCHANGE_GATEWAY_URL: http://exchange-access-gateway:8010
      DEFAULT_SYMBOLS: BTC-USDT-SWAP,ETH-USDT-SWAP
      DEFAULT_TIMEFRAMES: 1m,5m
      LOG_LEVEL: INFO
    ports:
      - "8011:8011"
    depends_on:
      - nats
      - redis
      - exchange-access-gateway

  realtime-state-service:
    build:
      context: .
      dockerfile: services/realtime-state-service/Dockerfile
    container_name: astraquant-realtime-state-service
    environment:
      SERVICE_NAME: realtime-state-service
      ENV: dev
      HTTP_PORT: 8012
      NATS_URL: nats://nats:4222
      REDIS_ADDR: redis:6379
      DEFAULT_EXCHANGE: OKX
      DEFAULT_SYMBOLS: BTC-USDT-SWAP,ETH-USDT-SWAP
      DEFAULT_TIMEFRAMES: 1m,5m
      LOG_LEVEL: INFO
    ports:
      - "8012:8012"
    depends_on:
      - nats
      - redis
      - realtime-market-gateway

  signal-engine:
    build:
      context: .
      dockerfile: services/signal-engine/Dockerfile
    container_name: astraquant-signal-engine
    environment:
      SERVICE_NAME: signal-engine
      ENV: dev
      HTTP_PORT: 8009
      DATABASE_URL: postgresql+asyncpg://astra:astra_password@postgres:5432/astraquant
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      STRATEGY_SCORE_SERVICE_URL: http://strategy-score-service:8007
      REALTIME_STATE_SERVICE_URL: http://realtime-state-service:8012
      DEFAULT_EXCHANGE: OKX
      DEFAULT_SYMBOLS: BTC-USDT-SWAP,ETH-USDT-SWAP
      DEFAULT_TIMEFRAMES: 1m,5m
      RUNTIME_MODE: HYBRID
      STATE_POLL_INTERVAL_MS: 1000
      SIGNAL_COOLDOWN_SECONDS: 300
      MAX_SPREAD_PCT: 0.001
      MAX_ABS_FUNDING_RATE: 0.0005
      LOG_LEVEL: INFO
    ports:
      - "8009:8009"
    depends_on:
      - postgres
      - redis
      - nats
      - strategy-service
      - strategy-score-service
      - realtime-state-service

  risk-engine:
    build:
      context: .
      dockerfile: services/risk-engine/Dockerfile
    container_name: astraquant-risk-engine
    environment:
      SERVICE_NAME: risk-engine
      ENV: dev
      HTTP_PORT: 8013
      POSTGRES_DSN: postgres://astra:astra_password@postgres:5432/astraquant?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      REALTIME_STATE_SERVICE_URL: http://realtime-state-service:8012
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      SIGNAL_ENGINE_URL: http://signal-engine:8009
      LOG_LEVEL: INFO
    ports:
      - "8013:8013"
    depends_on:
      - postgres
      - redis
      - nats
      - realtime-state-service
      - signal-engine

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: astraquant-api-gateway
    environment:
      SERVICE_NAME: api-gateway
      ENV: dev
      AUTH_SERVICE_URL: http://auth-service:8001
      STRATEGY_SERVICE_URL: http://strategy-service:8002
      MARKET_DATA_SERVICE_URL: http://market-data-service:8003
      BACKTEST_SERVICE_URL: http://backtest-service:8004
      REPLAY_SERVICE_URL: http://replay-service:8005
      AI_ANALYSIS_SERVICE_URL: http://ai-analysis-service:8006
      STRATEGY_SCORE_SERVICE_URL: http://strategy-score-service:8007
      REPORT_SERVICE_URL: http://report-service:8008
      REALTIME_STATE_SERVICE_URL: http://realtime-state-service:8012
      SIGNAL_ENGINE_URL: http://signal-engine:8009
      RISK_ENGINE_URL: http://risk-engine:8013
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: change_me
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - strategy-service
      - market-data-service
      - backtest-service
      - replay-service
      - ai-analysis-service
      - strategy-score-service
      - report-service
      - realtime-state-service
      - signal-engine
      - risk-engine

volumes:
  postgres_data:
  minio_data:
