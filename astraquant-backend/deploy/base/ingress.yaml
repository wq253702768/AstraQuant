apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: astraquant-ingress
  namespace: astraquant
spec:
  rules:
    - host: api.astraquant.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8000
