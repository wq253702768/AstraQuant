version: "3.9"

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports: []

  redis:
    restart: unless-stopped
    ports: []

  nats:
    restart: unless-stopped
    ports: []

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports: []

  auth-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

  strategy-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  market-data-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  backtest-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  replay-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  ai-analysis-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  strategy-score-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  report-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  signal-engine:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  paper-trading-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  paper-monitor-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  exchange-account-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant
      LOCAL_MASTER_KEY: ${LOCAL_MASTER_KEY:?LOCAL_MASTER_KEY is required}

  live-trading-monitor-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  alert-center-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  audit-center-service:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

  strategy-lifecycle-center:
    restart: unless-stopped
    environment:
      ENV: staging
      DATABASE_URL: postgresql+asyncpg://astra:${POSTGRES_PASSWORD}@postgres:5432/astraquant

  api-gateway:
    restart: unless-stopped
    environment:
      ENV: staging
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
